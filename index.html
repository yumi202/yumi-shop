<!DOCTYPE html>
<html lang="zh-CN" data-v="2026080523">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yumi">
<meta name="theme-color" content="#ec4899">
<meta name="description" content="Yumi 电商工作台">
<title>Yumi</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%23ec4899'/%3E%3Ctext x='96' y='120' text-anchor='middle' font-size='100' font-family='serif' fill='white'%3EY%3C/text%3E%3C/svg%3E">
<style>
/* ========== CSS Reset & Variables ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#ec4899;--pink-light:#fdf2f8;--pink-dark:#be185d;
  --purple:#a855f7;--purple-light:#faf5ff;--purple-dark:#7c3aed;
  --white:#fff;--bg:#fdf2f8;--text:#1f2937;--text-light:#6b7280;
  --border:#fce7f3;--shadow:0 4px 24px rgba(236,72,153,0.08);
  --shadow-lg:0 12px 40px rgba(236,72,153,0.12);
  --radius:16px;--radius-sm:12px;--radius-xs:8px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font-stack:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-stack);background:var(--bg);color:var(--text);
  min-height:100vh;min-height:-webkit-fill-available;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:var(--safe-bottom);
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
img{max-width:100%;height:auto;display:block}

/* ========== Common ========== */
.page{display:none}
.page.active{display:block}
.container{max-width:1200px;margin:0 auto;padding:0 16px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 24px;border-radius:var(--radius-xs);font-weight:600;
  font-size:1rem;transition:all .2s;min-height:44px;
  -webkit-tap-highlight-color:transparent;
}
.btn-primary{background:var(--pink);color:#fff}
.btn-primary:hover{background:var(--pink-dark)}
.btn-primary:active{transform:scale(.97)}
.btn-outline{background:var(--white);color:var(--pink);border:2px solid var(--pink)}
.btn-outline:hover{background:var(--pink-light)}
.btn-ghost{color:var(--text-light)}
.btn-ghost:hover{color:var(--pink)}
.btn-sm{padding:8px 16px;font-size:.875rem}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}

.input{
  width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius-xs);
  font-size:16px;background:var(--white);transition:border-color .2s;min-height:44px;
}
.input:focus{outline:none;border-color:var(--pink)}
.input::placeholder{color:#d1d5db}

.card{
  background:var(--white);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:20px;border-radius:10px;
  background:var(--pink);color:#fff;font-size:12px;font-weight:700;
  padding:0 6px;line-height:1;
}

/* ========== Password Gate ========== */
.password-gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg, var(--pink-light) 0%, var(--purple-light) 100%);
  padding:20px;
}
.password-card{
  background:var(--white);border-radius:var(--radius);padding:40px 32px;
  box-shadow:var(--shadow-lg);width:100%;max-width:400px;text-align:center;
}
.password-card .logo{
  width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg, var(--pink), var(--purple));
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
  color:#fff;font-size:36px;font-weight:900;font-family:Georgia,serif;
}
.password-card h1{font-size:1.5rem;margin-bottom:8px;color:var(--pink-dark)}
.password-card p{color:var(--text-light);margin-bottom:24px;font-size:.9rem}
.password-card .error{color:#ef4444;font-size:.875rem;margin-top:12px;min-height:20px}

/* ========== Name Gate ========== */
.name-gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg, var(--pink-light) 0%, var(--purple-light) 100%);
  padding:20px;
}
.name-card{
  background:var(--white);border-radius:var(--radius);padding:40px 32px;
  box-shadow:var(--shadow-lg);width:100%;max-width:400px;text-align:center;
}
.name-card h2{font-size:1.3rem;margin-bottom:6px;color:var(--pink-dark)}
.name-card p{color:var(--text-light);margin-bottom:24px;font-size:.9rem}

/* ========== Top Bar ========== */
.top-bar{
  position:sticky;top:0;z-index:100;background:var(--white);
  border-bottom:1px solid var(--border);padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
  height:56px;box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.top-bar .brand{font-size:1.25rem;font-weight:900;color:var(--pink);letter-spacing:-0.5px}
.top-bar .brand span{font-family:Georgia,serif}
.top-bar-actions{display:flex;align-items:center;gap:12px}
.top-bar-actions .cart-btn{
  position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-xs);transition:background .2s;
}
.top-bar-actions .cart-btn:hover{background:var(--pink-light)}
.top-bar-actions .cart-btn .badge{
  position:absolute;top:4px;right:2px;
}
.top-bar-actions .icon-btn{
  position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-xs);transition:background .2s;
}
.top-bar-actions .icon-btn:hover{background:var(--pink-light)}

/* ========== Password Input with Eye Toggle ========== */
.pwd-wrap{position:relative}
.pwd-wrap .input{padding-right:48px}
.pwd-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  color:var(--text-light);cursor:pointer;
}

/* ========== Image Carousel ========== */
.carousel{
  position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:var(--radius);
  background:#f9fafb;margin:16px 0;
}
.carousel-track{
  display:flex;width:100%;height:100%;transition:transform .3s ease;
  touch-action:pan-y;
}
.carousel-slide{
  min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;
}
.carousel-slide img{width:100%;height:100%;object-fit:cover}
.carousel-slide .placeholder{font-size:5rem;color:#e5e7eb}
.carousel-btn{
  position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;
  border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:2;
}
.carousel-btn.prev{left:8px}
.carousel-btn.next{right:8px}
.carousel-dots{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:2;
}
.carousel-dots .dot{
  width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.5);transition:all .2s;
}
.carousel-dots .dot.active{background:var(--pink);width:20px;border-radius:4px}

/* ========== Option Buttons (Size/Color) ========== */
.option-btns{display:flex;flex-wrap:wrap;gap:8px}
.option-btn{
  padding:8px 16px;border-radius:var(--radius-xs);font-size:.9rem;font-weight:600;
  border:2px solid var(--border);background:var(--white);color:var(--text);
  min-height:40px;transition:all .2s;
}
.option-btn.active{border-color:var(--pink);background:var(--pink-light);color:var(--pink-dark)}
.option-btn.color-btn{display:flex;align-items:center;gap:6px}
.option-btn .color-dot{width:16px;height:16px;border-radius:50%;border:1px solid #ddd}

/* ========== Sub Tabs (Admin Orders) ========== */
.sub-tabs{display:flex;gap:8px;margin-bottom:16px}
.sub-tabs button{
  padding:8px 16px;border-radius:20px;font-size:.85rem;font-weight:600;
  background:var(--white);color:var(--text-light);border:1px solid var(--border);min-height:36px;
}
.sub-tabs button.active{background:var(--purple);color:#fff;border-color:var(--purple)}

/* ========== History Page ========== */
.history-page{padding:16px 16px 80px}
.history-page h2{font-size:1.3rem;font-weight:700;margin-bottom:16px}
.history-card{
  background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px;
}
.history-card .hc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.history-card .hc-order-no{font-size:.8rem;color:var(--text-light)}
.history-card .hc-date{font-size:.8rem;color:var(--text-light)}
.history-card .hc-status{font-size:.75rem;padding:2px 8px;border-radius:10px;font-weight:600}
.history-card .hc-status.pending{background:#fef3c7;color:#d97706}
.history-card .hc-status.completed{background:#d1fae5;color:#059669}
.history-card .hc-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.history-card .hc-item:last-child{border-bottom:none}
.history-card .hc-item .hci-img{width:48px;height:48px;border-radius:6px;overflow:hidden;background:#f9fafb;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.history-card .hc-item .hci-img img{width:100%;height:100%;object-fit:cover}
.history-card .hc-item .hci-info{flex:1}
.history-card .hc-item .hci-name{font-size:.85rem;font-weight:600}
.history-card .hc-item .hci-spec{font-size:.8rem;color:var(--text-light)}
.history-card .hc-item .hci-qty{font-size:.8rem;color:var(--pink);font-weight:700}

/* ========== Admin Order Cards ========== */
.order-group{margin-bottom:16px}
.order-group .og-name{font-size:1rem;font-weight:700;margin-bottom:8px;color:var(--purple-dark)}
.order-card{
  background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:8px;
}
.order-card .oc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.order-card .oc-no{font-size:.8rem;color:var(--text-light)}
.order-card .oc-date{font-size:.8rem;color:var(--text-light)}
.order-card .oc-item{padding:6px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.order-card .oc-item:last-child{border-bottom:none}
.order-card .oc-item .oci-name{font-weight:600}
.order-card .oc-item .oci-spec{color:var(--text-light);font-size:.8rem;display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;padding:2px 0}
.order-card .oc-item .oci-spec .oci-price{color:var(--pink);font-weight:700}
.order-card .oc-actions{margin-top:8px;display:flex;gap:8px}

/* ========== Add Product Form ========== */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag-item{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:16px;background:var(--pink-light);font-size:.8rem;color:var(--pink-dark);
}
.tag-item .tag-del{cursor:pointer;font-weight:700;margin-left:2px}
.color-stock-row{
  display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);
  border-radius:var(--radius-xs);margin-bottom:8px;background:var(--white);
}
.color-stock-row .csr-color{font-weight:600;min-width:60px}
.color-stock-row .csr-img{width:40px;height:40px;border-radius:6px;overflow:hidden;background:#f9fafb;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.color-stock-row .csr-img img{width:100%;height:100%;object-fit:cover}
.color-stock-row input[type=number]{width:70px}
.main-images{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.main-img-slot{
  aspect-ratio:1;border-radius:var(--radius-xs);overflow:hidden;border:2px dashed var(--border);
  background:#f9fafb;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;
}
.main-img-slot img{width:100%;height:100%;object-fit:cover}
.main-img-slot .slot-num{position:absolute;top:2px;left:4px;font-size:.7rem;color:var(--text-light);background:rgba(255,255,255,0.8);padding:0 4px;border-radius:4px}

/* ========== Combo Stock Matrix ========== */
.combo-stock-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:8px}
.combo-stock-table th{background:var(--pink-light);padding:8px 6px;text-align:center;font-weight:600;color:var(--pink-dark);border:1px solid var(--border);white-space:nowrap}
.combo-stock-table td{padding:6px;border:1px solid var(--border);text-align:center}
.combo-stock-table .combo-color-cell{font-weight:600;white-space:nowrap}
.combo-stock-table .combo-color-cell img{width:28px;height:28px;border-radius:4px;object-fit:cover;display:inline-block;vertical-align:middle;margin-right:4px}
.combo-stock-table .combo-color-cell .no-img{display:inline-block;width:28px;height:28px;border-radius:4px;background:#f9fafb;border:1px dashed var(--border);vertical-align:middle;margin-right:4px;font-size:.6rem;line-height:28px;color:#ccc}
.combo-stock-input{width:50px;text-align:center;border:1px solid var(--border);border-radius:4px;padding:4px;font-size:.85rem}
.combo-stock-btn{width:28px;height:28px;border-radius:4px;border:1px solid var(--pink);background:var(--pink-light);color:var(--pink);font-weight:700;cursor:pointer}
.combo-stock-btn:hover{background:var(--pink);color:#fff}
.combo-batch-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.combo-batch-bar button{min-height:36px;padding:4px 12px;border-radius:8px;font-size:.8rem;font-weight:600;border:1px solid var(--border);background:var(--white);cursor:pointer}
.combo-batch-bar button:hover{background:var(--pink-light)}

/* ========== Cart Grouped ========== */
.cart-group{margin-bottom:16px}
.cart-group-title{font-size:.9rem;font-weight:700;color:var(--purple-dark);margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--purple-light)}
.cart-product-item{background:#fafafa;border-radius:8px;padding:10px;margin-bottom:8px}
.cart-product-item .cpi-name{font-weight:600;font-size:.9rem;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.cart-product-item .cpi-del{color:#ef4444;font-size:.75rem;cursor:pointer}
.cart-product-item .cpi-spec{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--text-light);padding:4px 0}
.cart-product-item .cpi-spec .cpi-qty{display:flex;align-items:center;gap:4px}
.cart-product-item .cpi-spec .cpi-qty button{width:28px;height:28px;border-radius:6px;background:var(--pink-light);color:var(--pink);font-weight:700;border:none;cursor:pointer}
.cart-product-item .cpi-spec .cpi-qty span{width:28px;text-align:center;font-weight:600}
.cart-group-total{text-align:right;font-size:.85rem;font-weight:700;color:var(--pink);margin-bottom:8px}
.top-bar-actions .back-btn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-xs);margin-right:-8px;
}

/* ========== Home Page ========== */
.home-bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0.15}
.home-page{padding:20px 16px 80px;position:relative;z-index:1}
.home-carousel{
  position:relative;width:100%;height:200px;overflow:hidden;border-radius:var(--radius);
  margin-bottom:16px;background:linear-gradient(135deg,var(--pink-light),var(--purple-light));
}
.home-carousel .carousel-track{display:flex;height:100%;transition:transform .5s ease}
.home-carousel .carousel-slide{min-width:100%;height:100%}
.home-carousel .carousel-slide img{width:100%;height:100%;object-fit:cover}
.home-carousel .carousel-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.home-hero{text-align:center;padding:30px 0 20px}
.home-hero h1{font-size:2rem;font-weight:900;color:var(--pink-dark);margin-bottom:4px}
.home-hero h1 span{font-family:Georgia,serif}
.home-hero .subtitle{color:var(--text-light);font-size:.95rem}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.category-card{
  background:var(--white);border-radius:var(--radius);padding:24px 16px;
  text-align:center;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .2s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
}
.category-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.category-card:active{transform:scale(.97)}
.category-icon{
  width:64px;height:64px;border-radius:20px;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
}
.category-icon.cosmetics{background:#fce7f3;color:#ec4899}
.category-icon.meirenji{background:#ede9fe;color:#a855f7}
.category-icon.shoujinti{background:#fef3c7;color:#f59e0b}
.category-card h3{font-size:1rem;font-weight:700;margin-bottom:4px}
.category-card .count{font-size:.8rem;color:var(--text-light)}

/* ========== Product List ========== */
.list-bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0.12}
.product-list-page{padding:0 16px 80px;position:relative;z-index:1}
.category-nav{
  display:flex;gap:8px;padding:12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;position:sticky;top:56px;z-index:99;background:var(--bg);
}
.category-nav::-webkit-scrollbar{display:none}
.category-nav button{
  padding:10px 20px;border-radius:24px;font-weight:600;font-size:.9rem;
  white-space:nowrap;transition:all .2s;min-height:44px;
  background:var(--white);color:var(--text-light);border:1px solid var(--border);
}
.category-nav button.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.product-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-top:4px;
}
.product-card{
  background:var(--white);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
}
.product-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.product-card:active{transform:scale(.97)}
.product-card .img-wrap{
  width:100%;aspect-ratio:1;overflow:hidden;background:#f9fafb;
  display:flex;align-items:center;justify-content:center;
}
.product-card .img-wrap img{width:100%;height:100%;object-fit:cover}
.product-card .img-wrap .placeholder{
  font-size:3rem;color:#e5e7eb;
}
.product-card .info{padding:10px 12px 12px}
.product-card .info .name{
  font-size:.9rem;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-bottom:6px;
}
.product-card .info .price{
  font-size:1.15rem;font-weight:900;color:var(--pink);
}
.product-card .info .price .unit{font-size:.75rem;font-weight:500}

/* ========== Product Detail ========== */
.detail-bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0.1}
.detail-page{padding:0 16px 80px;position:relative;z-index:1}
.detail-img{
  width:100%;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;
  background:#f9fafb;margin:16px 0;display:flex;align-items:center;justify-content:center;
}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-img .placeholder{font-size:5rem;color:#e5e7eb}
.detail-info{padding:0 4px}
.detail-info h2{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.detail-info .price{font-size:1.5rem;font-weight:900;color:var(--pink);margin-bottom:12px}
.detail-info .desc{color:var(--text-light);font-size:.9rem;line-height:1.7;margin-bottom:20px}
.option-group{margin-bottom:16px}
.option-group label{display:block;font-weight:600;font-size:.9rem;margin-bottom:8px;color:var(--text)}
.option-group select{
  width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius-xs);
  font-size:16px;background:var(--white);min-height:44px;
  -webkit-appearance:none;appearance:none;

/* ========== SHA-256 ========== */
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ========== Supabase API Wrappers ========== */
async function supabaseFetch(path, options = {}) {
  const url = `${SUPABASE_URL}/rest/v1/${path}`;
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': options.prefer || 'return=representation',
    ...options.headers
  };
  const res = await fetch(url, { ...options, headers });
  if (!res.ok) {
    const err = await res.text();
    console.error('Supabase error:', err);
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

async function uploadToStorage(file, bucket, filename) {
  const url = `${SUPABASE_URL}/storage/v1/object/${bucket}/${filename}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': file.type,
      'x-upsert': 'true'
    },
    body: file
  });
  if (!res.ok) throw new Error('Upload failed');
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${filename}`;
}

/* ========== Site Config ========== */
async function getSiteConfig(key) {
  try {
    const data = await supabaseFetch(`site_config?key=eq.${key}&select=value`);
    return data.length > 0 ? data[0].value : null;
  } catch { return null; }
}

async function setSiteConfig(key, value) {
  const existing = await supabaseFetch(`site_config?key=eq.${key}&select=id`);
  if (existing.length > 0) {
    await fetch(`${SUPABASE_URL}/rest/v1/site_config?id=eq.${existing[0].id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ value })
    });
  } else {
    await fetch(`${SUPABASE_URL}/rest/v1/site_config`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ key, value })
    });
  }
}

  const loginData = localStorage.getItem('yumi_login');

    try {
      const { auth, name, expire, pwdVersion } = JSON.parse(loginData);
      const now = Date.now();
      const currentVersion = await getSiteConfig('password_version') || '1';
      if (auth === 'true' && name && now < expire && pwdVersion === currentVersion) {
        customerName = name;
        updateCustomerDisplay();
        showPage('app');
        showPage('home');
        await loadAll();
      } else {
        localStorage.removeItem('yumi_login');
        if (auth === 'true') showPage('password');
      }
    } catch {
      localStorage.removeItem('yumi_login');
    }
  }

  // Load cart from localStorage
  const savedCart = localStorage.getItem('yumi_cart');
  if (savedCart) cart = JSON.parse(savedCart);
  updateCartBadge();

  // Init PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
}

function saveLogin(name) {
  const sevenDays = 7 * 24 * 60 * 60 * 1000;
  getSiteConfig('password_version').then(v => {
    const loginData = {
      auth: 'true', name, expire: Date.now() + sevenDays,
      pwdVersion: v || '1'
    };
    localStorage.setItem('yumi_login', JSON.stringify(loginData));
  });
}

async function checkPassword() {
  const input = document.getElementById('pwd-input').value.trim();
  const error = document.getElementById('pwd-error');
  if (!input) { error.textContent = '请输入密码'; return; }

  try {
    const storedHash = await getSiteConfig('front_password');
    if (!storedHash) {
      // First run: initialize password
      const hash = await sha256('shop2026');
      await setSiteConfig('front_password', hash);
      if (input !== 'shop2026') {
        error.textContent = '密码错误，请重试';
        return;
      }
    } else {
      const inputHash = await sha256(input);
      if (inputHash !== storedHash) {
        error.textContent = '密码错误，请重试';
        return;
      }
    }
    showPage('name');

    console.error(e);
    // Offline fallback
    if (input === 'shop2026') {
      showPage('name');
    } else {
      error.textContent = '密码错误，请重试';
    }
  }
}

}

  document.getElementById('category-nav').innerHTML = cats.map(cat =>
    `<button class="${currentCategory === cat ? 'active' : ''}" onclick="switchCategory('${cat}')">${getCategoryName(cat)}</button>`
  ).join('');
}

function switchCategory(cat) {
  currentCategory = cat;
  renderCategoryNav();
  renderProducts();
}

function renderProducts() {
  const filtered = products.filter(p => p.category === currentCategory);
  document.getElementById('product-grid').innerHTML = filtered.map(p => {
    const images = parseImages(p);
    const mainImg = images[0] || p.image_url || '';
    return `
    <div class="product-card" onclick="showDetail('${p.id}')">
      <div class="img-wrap">
        ${mainImg ? `<img src="${mainImg}" alt="${escapeHtml(p.name)}" loading="lazy">` : '<span class="placeholder">📦</span>'}
      </div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="price"><span class="unit">¥</span>${p.price}</div>
      </div>
    </div>`;
  }).join('');
}

function parseImages(p) {
  try { return JSON.parse(p.images || '[]'); } catch { return []; }
}
function parseColorImages(p) {
  try { return JSON.parse(p.color_images || '{}'); } catch { return {}; }
}
function parseColorStock(p) {
  try { return JSON.parse(p.color_stock || '{}'); } catch { return {}; }
}
function parseCustomSpecs(p) {
  try {
    const arr = JSON.parse(p.custom_specs || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
// 统一库存 key 构造（三段式：颜色|尺码|自定义规格值）
function buildStockKey(color, size, spec) {
  return [color || '', size || '', spec || ''].join('|');
}
// 查询库存：兼容旧两段式 key（颜色|尺码）和新三段式 key（颜色|尺码|规格）
// 返回 null 表示未设库存（不限），数字表示库存量
function getDetailStock(stocks, color, size, spec) {
  // 优先查三段式
  const key3 = buildStockKey(color, size, spec);
  if (stocks[key3] !== undefined) return stocks[key3];
  // 兼容旧两段式（无自定义规格场景）
  if (!spec) {
    const key2 = (color || '') + '|' + (size || '');
    if (stocks[key2] !== undefined) return stocks[key2];
    // 旧版只按颜色存的库存
    if (!size && color && stocks[color] !== undefined) return stocks[color];
  }
  return null;
}

function showDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  showPage('detail');

  // 只显示管理员勾选/添加的尺码，不强制显示全部固定尺码
  const sizes = p.sizes ? p.sizes.split(',').map(s => s.trim()).filter(Boolean) : [];

  // 只显示管理员勾选/添加的颜色，不强制显示全部固定颜色
  const colors = p.colors ? p.colors.split(',').map(s => s.trim()).filter(Boolean) : [];

  const colorImages = parseColorImages(p);
  const colorStocks = parseColorStock(p);
  const customSpecs = parseCustomSpecs(p);
  const images = parseImages(p);
  const mainImages = images.length > 0 ? images : (p.image_url ? [p.image_url] : []);

  const colorMap = { '黑色':'#1a1a1a', '白色':'#fff', '红色':'#dc2626', '肤色':'#fdbcb4' };

  document.getElementById('detail-content').innerHTML = `
    <div class="carousel" id="detail-carousel">
      <div class="carousel-track" id="detail-carousel-track">
        ${mainImages.length > 0 ? mainImages.map(img => `<div class="carousel-slide"><img src="${img}" alt="${escapeHtml(p.name)}"></div>`).join('') : '<div class="carousel-slide"><span class="placeholder">📦</span></div>'}
      </div>
      ${mainImages.length > 1 ? `
        <button class="carousel-btn prev" onclick="carouselPrev()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="carousel-btn next" onclick="carouselNext()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        <div class="carousel-dots" id="detail-dots">${mainImages.map((_,i) => `<div class="dot ${i===0?'active':''}" onclick="carouselGoto(${i})"></div>`).join('')}</div>
      ` : ''}
    </div>
    <div class="detail-info">
      <h2>${escapeHtml(p.name)}</h2>
      <div class="price">¥${p.price}</div>
      <div class="desc">${escapeHtml(p.description || '暂无简介')}</div>
      ${sizes.length > 0 ? `<div class="option-group">
        <label>尺码</label>
        <div class="option-btns" id="detail-sizes">
          ${sizes.map((s,i) => {
            const sStock = getDetailStock(colorStocks, '', s, '');
            const sSoldOut = sStock !== null && sStock <= 0;
            return `<button class="option-btn ${i===0?'active':''}" ${sSoldOut?'disabled style="opacity:0.4"':''} onclick="selectOption(this,'detail-sizes')">${s}${sSoldOut?' (已售罄)':''}</button>`;
          }).join('')}
        </div>
      </div>` : ''}
      ${colors.length > 0 ? `<div class="option-group">
        <label>颜色</label>
        <div class="option-btns" id="detail-colors">
          ${colors.map((c,i) => {
            const cStock = getDetailStock(colorStocks, c, '', '');
            const soldOut = cStock !== null && cStock <= 0;
            return `<button class="option-btn color-btn ${i===0?'active':''}" ${soldOut?'disabled style="opacity:0.4"':''} onclick="selectColor(this,'${c.replace(/'/g,"\\'")}')">
              <span class="color-dot" style="background:${colorMap[c]||'#ccc'}${c==='白色'?';border:1px solid #ddd':''}"></span>${c}${soldOut?' (已售罄)':''}
            </button>`;
          }).join('')}
        </div>
      </div>` : ''}
      ${customSpecs.length > 0 ? customSpecs.map((sp,si) => `<div class="option-group">
        <label>${escapeHtml(sp.name)}</label>
        <div class="option-btns" id="detail-spec-${si}">
          ${(sp.options||[]).map((opt,oi) => {
            const optStock = getDetailStock(colorStocks, '', '', opt);
            const optSoldOut = optStock !== null && optStock <= 0;
            return `<button class="option-btn ${oi===0?'active':''}" ${optSoldOut?'disabled style="opacity:0.4"':''} onclick="selectOption(this,'detail-spec-${si}')">${escapeHtml(opt)}${optSoldOut?' (已售罄)':''}</button>`;
          }).join('')}
        </div>
      </div>`).join('') : ''}
      <div class="option-group">
        <label>数量</label>
        <div class="qty-control">
          <button onclick="changeQty(-1)">−</button>
          <span class="qty" id="detail-qty">1</span>
          <button onclick="changeQty(1)">+</button>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn btn-outline" onclick="goBack()">返回</button>
        <button class="btn btn-primary" onclick="addToCart('${p.id}')">加入购物车</button>
      </div>
    </div>
  `;
  window._detailProduct = p;
  window._detailQty = 1;
  window._detailImages = mainImages;
  window._detailColorImages = colorImages;
  window._detailColorStocks = colorStocks;
  detailCarouselIdx = 0;
}

function selectOption(btn, containerId) {
  document.querySelectorAll(`#${containerId} .option-btn`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function selectColor(btn, color) {
  document.querySelectorAll('#detail-colors .option-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Switch main image to color image if available
  const colorImages = window._detailColorImages || {};
  if (colorImages[color]) {
    window._detailImages = [colorImages[color]];
    carouselGoto(0);
    renderCarousel();
  } else {
    // Restore default main images
    const p = window._detailProduct;
    const images = parseImages(p);
    window._detailImages = images.length > 0 ? images : (p.image_url ? [p.image_url] : []);
    renderCarousel();
  }
}

function renderCarousel() {
  const track = document.getElementById('detail-carousel-track');
  if (!track) return;
  const imgs = window._detailImages || [];
  if (imgs.length === 0) {
    track.innerHTML = '<div class="carousel-slide"><span class="placeholder">📦</span></div>';
    return;
  }
  track.innerHTML = imgs.map(img => `<div class="carousel-slide"><img src="${img}"></div>`).join('');
  const dots = document.getElementById('detail-dots');
  if (dots) dots.innerHTML = imgs.map((_,i) => `<div class="dot ${i===detailCarouselIdx?'active':''}" onclick="carouselGoto(${i})"></div>`).join('');
  track.style.transform = `translateX(-${detailCarouselIdx * 100}%)`;
}

function carouselPrev() {
  const len = (window._detailImages||[]).length;
  if (len <= 1) return;
  detailCarouselIdx = (detailCarouselIdx - 1 + len) % len;
  updateCarouselPos();
}
function carouselNext() {
  const len = (window._detailImages||[]).length;
  if (len <= 1) return;
  detailCarouselIdx = (detailCarouselIdx + 1) % len;
  updateCarouselPos();
}
function carouselGoto(i) {
  detailCarouselIdx = i;
  updateCarouselPos();
}
function updateCarouselPos() {
  const track = document.getElementById('detail-carousel-track');
  if (track) track.style.transform = `translateX(-${detailCarouselIdx * 100}%)`;
  document.querySelectorAll('#detail-dots .dot').forEach((d,i) => d.classList.toggle('active', i === detailCarouselIdx));
}

function changeQty(delta) {
  window._detailQty = Math.max(1, (window._detailQty || 1) + delta);
  document.getElementById('detail-qty').textContent = window._detailQty;
}

function addToCart(productId) {
  const p = window._detailProduct;
  if (!p) return;
  const sizeBtn = document.querySelector('#detail-sizes .option-btn.active');
  const colorBtn = document.querySelector('#detail-colors .option-btn.active');
  const size = sizeBtn ? sizeBtn.textContent.replace(' (已售罄)','').trim() : '';
  const color = colorBtn ? colorBtn.textContent.replace(' (已售罄)','').trim() : '';

  // 读取自定义规格选中项
  const customSpecs = parseCustomSpecs(p);
  const specParts = [];
  customSpecs.forEach((sp, si) => {
    const btn = document.querySelector(`#detail-spec-${si} .option-btn.active`);
    if (btn) specParts.push(sp.name + ':' + btn.textContent.replace(' (已售罄)','').trim());
  });
  const spec = specParts.join('; ');
  // 用于库存查询的 spec 值（取第一个自定义规格的选项值，简化为单规格库存）
  var specBtn = document.querySelector('#detail-spec-0 .option-btn.active');
  var specVal = customSpecs.length > 0 ? (specBtn ? specBtn.textContent.replace(' (已售罄)','').trim() : '') : '';

  const qty = window._detailQty || 1;

  // 统一库存校验（三段式 key，兼容旧数据）
  const stocks = window._detailColorStocks || {};
  const stock = getDetailStock(stocks, color, size, specVal);
  if (stock !== null && stock < qty) {
    showToast('库存不足');
    return;
  }

  const images = parseImages(p);
  const img = images[0] || p.image_url || '';

  const existing = cart.find(c => c.productId === productId && c.size === size && c.color === color && c.spec === spec);
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({ productId, name: p.name, price: p.price, image_url: img, size, color, spec, specVal, qty });
  }
  saveCart();
  showToast('已加入购物车');
  window._detailQty = 1;
}

/* ========== Cart ========== */
function openCart() {
  document.getElementById('cart-overlay').classList.add('open');
  renderCart();
}

function closeCart() {
  document.getElementById('cart-overlay').classList.remove('open');
}

function closeCartOutside(e) {
  if (e.target === document.getElementById('cart-overlay')) closeCart();
}

function renderCart() {
  const el = document.getElementById('cart-items');
  const footer = document.getElementById('cart-footer');

  if (cart.length === 0) {
    el.innerHTML = '<div class="cart-empty">购物车是空的</div>';
    footer.style.display = 'none';
    return;
  }

  const categories = [
    { key: 'cosmetics', name: '化妆品' },
    { key: 'meirenji', name: '美人计' },
    { key: 'shoujinti', name: '瘦金体' }
  ];

  let grandTotal = 0;
  let html = '';

  categories.forEach(cat => {
    const catItems = cart.filter(item => {
      const p = products.find(pp => pp.id === item.productId);
      return p && p.category === cat.key;
    });
    // Also handle items without product match (fallback)
    if (catItems.length === 0) return;

    let catTotal = 0;
    html += `<div class="cart-group"><div class="cart-group-title">${cat.name}</div>`;

    // Group by product name
    const byProduct = {};
    catItems.forEach(item => {
      if (!byProduct[item.name]) byProduct[item.name] = [];
      byProduct[item.name].push(item);
    });

    for (const [pname, items] of Object.entries(byProduct)) {
      let productTotal = 0;
      const specsHtml = items.map(item => {
        const subtotal = item.price * item.qty;
        productTotal += subtotal;
        const idx = cart.indexOf(item);
        return `<div class="cpi-spec">
          <span>${[item.size, item.color, item.spec].filter(Boolean).join(' / ') || '默认'}</span>
          <div class="cpi-qty">
            <span>¥${subtotal.toFixed(2)}</span>
            <button onclick="cartChangeQty(${idx},-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="cartChangeQty(${idx},1)">+</button>
          </div>
        </div>`;
      }).join('');

      const firstItem = items[0];
      html += `<div class="cart-product-item">
        <div class="cpi-name">
          <span>${firstItem.image_url ? `<img src="${firstItem.image_url}" style="width:32px;height:32px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:6px">` : ''}${escapeHtml(pname)}</span>
          <span class="cpi-del" onclick="removeProductFromCart('${pname.replace(/'/g,"\\'")}')">删除该商品</span>
        </div>
        ${specsHtml}
      </div>`;
      catTotal += productTotal;
    }

    html += `<div class="cart-group-total">${cat.name}小计: ¥${catTotal.toFixed(2)}</div>`;
    html += '</div>';
    grandTotal += catTotal;
  });

  // Handle items without category match
  const uncategorized = cart.filter(item => {
    const p = products.find(pp => pp.id === item.productId);
    return !p;
  });
  if (uncategorized.length > 0) {
    html += '<div class="cart-group"><div class="cart-group-title">其他</div>';
    const byProduct = {};
    uncategorized.forEach(item => {
      if (!byProduct[item.name]) byProduct[item.name] = [];
      byProduct[item.name].push(item);
    });
    for (const [pname, items] of Object.entries(byProduct)) {
      let productTotal = 0;
      const specsHtml = items.map(item => {
        const subtotal = item.price * item.qty;
        productTotal += subtotal;
        const idx = cart.indexOf(item);
        return `<div class="cpi-spec">
          <span>${[item.size, item.color, item.spec].filter(Boolean).join(' / ') || '默认'}</span>
          <div class="cpi-qty">
            <span>¥${subtotal.toFixed(2)}</span>
            <button onclick="cartChangeQty(${idx},-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="cartChangeQty(${idx},1)">+</button>
          </div>
        </div>`;
      }).join('');
      html += `<div class="cart-product-item">
        <div class="cpi-name">
          <span>${escapeHtml(pname)}</span>
          <span class="cpi-del" onclick="removeProductFromCart('${pname.replace(/'/g,"\\'")}')">删除该商品</span>
        </div>
        ${specsHtml}
      </div>`;
      grandTotal += productTotal;
    }
    html += '</div>';
  }

  el.innerHTML = html;
  document.getElementById('cart-total').textContent = '¥' + grandTotal.toFixed(2);
  footer.style.display = 'flex';
}

function removeProductFromCart(productName) {
  cart = cart.filter(item => item.name !== productName);
  saveCart();
  renderCart();
}

function cartChangeQty(i, delta) {
  if (cart[i]) {
    cart[i].qty = Math.max(1, cart[i].qty + delta);
    saveCart();
    renderCart();
  }
}

function cartRemove(i) {
  cart.splice(i, 1);
  saveCart();
  renderCart();
}

function updateCartBadge() {
  const total = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-count');
  if (total > 0) {
    badge.style.display = 'flex';
    badge.textContent = total;
  } else {
    badge.style.display = 'none';
  }
}

function goCheckout() {
  if (cart.length === 0) return;
  closeCart();
  showPage('checkout');
  renderCheckout();
}

  const categories = [

  let itemsHtml = '';

          <div class="co-info">
            <div class="co-name">${escapeHtml(item.name)}</div>

      <button class="btn btn-ghost" onclick="goBack()" style="width:100%;margin-top:8px">返回</button>
    </div>
  `;
}

async function submitOrder() {
  if (cart.length === 0) return;

  const orderNumber = 'YM' + Date.now().toString(36).toUpperCase();
  const now = new Date().toISOString();

  try {
    const orderItems = cart.map(item => ({
      order_number: orderNumber,
      product_name: item.name,
      size: item.size || '',
      color: item.color || '',
      spec: item.spec || '',
      quantity: item.qty,
      customer_name: customerName,
      created_at: now,
      status: 'pending'
    }));

    await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(orderItems)
    });

    // Deduct stock (统一三段式 key：颜色|尺码|规格值，兼容旧两段式)
    for (const item of cart) {
      if (item.productId) {
        const p = products.find(pp => pp.id === item.productId);
        if (p) {
          const stocks = parseColorStock(p);
          const specVal = item.specVal || '';
          // 查实际存在的库存 key（三段式优先，再查旧两段式）
          let actualKey = null;
          const key3 = buildStockKey(item.color, item.size, specVal);
          const key2 = (item.color || '') + '|' + (item.size || '');
          if (stocks[key3] !== undefined) actualKey = key3;
          else if (!specVal && stocks[key2] !== undefined) actualKey = key2;
          else if (!specVal && !item.size && item.color && stocks[item.color] !== undefined) actualKey = item.color;
          if (actualKey !== null) {
            stocks[actualKey] = Math.max(0, stocks[actualKey] - item.qty);
            await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${p.id}`, {
              method: 'PATCH',
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
              body: JSON.stringify({ color_stock: JSON.stringify(stocks) })
            });
          }
        }
      }
    }

    // Send email notification via EmailJS
    await sendOrderEmail(orderNumber);

    cart = [];
    saveCart();
    showToast('下单成功！');
    showPage('home');
    await loadOrders();
    await loadProducts();
  } catch (e) {
    console.error('Submit order failed:', e);
    // Local fallback
    const localOrders = JSON.parse(localStorage.getItem('yumi_local_orders') || '[]');
    cart.forEach(item => {
      localOrders.push({
        id: Date.now().toString(),
        order_number: orderNumber,
        product_name: item.name,
        size: item.size || '',
        color: item.color || '',
        spec: item.spec || '',
        quantity: item.qty,
        customer_name: customerName,
        created_at: now,
        status: 'pending'
      });
    });
    localStorage.setItem('yumi_local_orders', JSON.stringify(localOrders));
    cart = [];
    saveCart();
    showToast('下单成功！（离线模式）');
    showPage('home');
  }
}

async function sendOrderEmail(orderNumber) {
  try {
    const config = await getSiteConfig('emailjs_config');
    if (!config) return;
    const { service_id, template_id, user_id, admin_email } = JSON.parse(config);
    if (!service_id || !template_id || !user_id || !admin_email) return;

    const orderSummary = cart.map(item =>
      `${item.name} ${item.size ? '(' + item.size + ')' : ''} ${item.color ? '[' + item.color + ']' : ''} ${item.spec ? '<' + item.spec + '>' : ''} × ${item.qty} = ¥${(item.price * item.qty).toFixed(2)}`
    ).join('\n');
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

    // Call EmailJS API directly
    await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id, template_id, user_id,
        template_params: {
          to_email: admin_email,
          order_number: orderNumber,
          customer_name: customerName,
          order_summary: orderSummary,
          total_amount: '¥' + total.toFixed(2),
          order_time: formatDate(new Date().toISOString())
        }
      })
    });
  } catch (e) {
    console.warn('Email notification failed (non-critical):', e);
  }
}

/* ========== Orders ========== */
async function loadOrders() {
  try {
    const data = await supabaseFetch('orders?order=created_at.desc&limit=500');
    orders = Array.isArray(data) ? data : [];
    console.log('loadOrders: loaded', orders.length, 'orders');

async function forceLoadOrders() {
  const container = document.getElementById('orders-container');
  if (container) container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-light)">正在加载...</div>';
  showToast('正在加载...');
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/orders?order=created_at.desc&limit=500', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    orders = Array.isArray(data) ? data : [];
    console.log('forceLoadOrders: loaded', orders.length, 'orders');
    showToast('已加载 ' + orders.length + ' 条订单');
  } catch (e) {
    console.error('forceLoadOrders error:', e);
    orders = JSON.parse(localStorage.getItem('yumi_local_orders') || '[]');
    showToast('网络失败，本地' + orders.length + '条');
  }
  // 如果商品没加载，先加载商品再渲染
  if (!window.products || window.products.length === 0) {
    try {
      const pData = await supabaseFetch('products?order=created_at.desc');
      window.products = Array.isArray(pData) ? pData : [];
      products = window.products;
      console.log('forceLoadOrders also loaded products:', products.length);
    } catch (e2) { console.error('load products in forceLoadOrders failed:', e2); }
  }
  renderOrders();
}

function switchOrderTab(tab) {
  orderTab = tab;
  const btnP = document.getElementById('tab-pending');
  const btnC = document.getElementById('tab-completed');
  if (btnP) btnP.classList.toggle('active', tab === 'pending');
  if (btnC) btnC.classList.toggle('active', tab === 'completed');
  renderOrders();
}

function renderOrders() {
  const container = document.getElementById('orders-container');
  if (!container) { console.error('orders-container not found'); return; }

  try {
    console.log('renderOrders: orders=' + orders.length + ' tab=' + orderTab);
    var search = (document.getElementById('order-search') && document.getElementById('order-search').value || '').toLowerCase();
    var filtered = orders.filter(function(o) {
      var matchStatus = (o.status || 'pending') === orderTab;
      var matchSearch = !search || (o.customer_name || '').toLowerCase().indexOf(search) >= 0;
      return matchStatus && matchSearch;
    });
    console.log('renderOrders: filtered=' + filtered.length);

    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-light)">暂无' + (orderTab === 'pending' ? '待发货' : '已完成') + '订单<br><span style="font-size:.8rem">总订单: ' + orders.length + '</span><br><button class="btn btn-primary btn-sm" onclick="forceLoadOrders()" style="margin-top:12px">点击重新加载</button></div>';
      return;
    }

    // 按顾客分组
    var byCustomer = {};
    filtered.forEach(function(o) {
      var cn = o.customer_name || '未知';
      if (!byCustomer[cn]) byCustomer[cn] = [];
      byCustomer[cn].push(o);
    });

    var html = '';
    Object.keys(byCustomer).forEach(function(cn) {
      var custOrders = byCustomer[cn];
      html += '<div class="order-group"><div class="og-name">' + escapeHtml(cn) + '</div>';

      // 按订单号分组
      var byOrderNo = {};
      custOrders.forEach(function(o) {
        var no = o.order_number || 'unknown';
        if (!byOrderNo[no]) byOrderNo[no] = [];
        byOrderNo[no].push(o);
      });

      Object.keys(byOrderNo).forEach(function(no) {
        var items = byOrderNo[no];
        var time = items[0].created_at ? formatDate(items[0].created_at) : '';
        var total = 0;

        html += '<div class="order-card"><div class="oc-header"><span class="oc-date">' + time + '</span></div>';

        // 按商品分组
        var byProduct = {};
        items.forEach(function(item) {
          var pn = item.product_name || '未知';
          if (!byProduct[pn]) byProduct[pn] = [];
          byProduct[pn].push(item);
        });

        Object.keys(byProduct).forEach(function(pn) {
          var prod = (window.products && window.products.find) ? window.products.find(function(pp) { return pp.name === pn; }) : null;
          var price = prod ? parseFloat(prod.price) : 0;
          var prodItems = byProduct[pn];
          var prodSub = 0;

          html += '<div class="oc-item"><div class="oci-name">' + escapeHtml(pn) + '</div>';

          prodItems.forEach(function(item) {
            var specs = [item.color, item.size, item.spec].filter(Boolean).join(' / ') || '默认';
            var sub = price * item.quantity;
            prodSub += sub;
            html += '<div class="oci-spec"><span>规格: ' + escapeHtml(specs) + '</span><span>数量: x' + item.quantity + '</span><span class="oci-price">¥' + sub.toFixed(2) + '</span></div>';
          });

          html += '<div style="text-align:right;font-size:.8rem;color:var(--text-light);padding:2px 0">小计: ¥' + prodSub.toFixed(2) + '</div></div>';
          total += prodSub;
        });

        html += '<div style="text-align:right;padding:8px 0;border-top:1px solid var(--border);font-weight:700;color:var(--pink)">合计: ¥' + total.toFixed(2) + '</div>';
        html += '<div class="oc-actions">';
        if (orderTab === 'pending') {
          html += '<button class="btn btn-primary btn-sm" onclick="confirmShip(\'' + no + '\')">确认发货</button>';
          html += '<button class="btn btn-outline btn-sm" onclick="copySingleOrder(\'' + no + '\')">复制此单</button>';
        } else {
          html += '<span style="color:#059669;font-size:.8rem">已完成</span>';
        }
        html += '</div></div>';
      });
      html += '</div>';
    });

    container.innerHTML = html;
    console.log('renderOrders done, html=' + html.length + ' chars');
  } catch (err) {
    console.error('renderOrders error:', err);
    container.innerHTML = '<div style="padding:20px;color:#ef4444">出错: ' + err.message + '<br><button class="btn btn-primary btn-sm" onclick="forceLoadOrders()" style="margin-top:12px">重新加载</button></div>';
  }
}

function copySingleOrder(orderNo) {
  var items = orders.filter(function(o) { return o.order_number === orderNo; });
  if (items.length === 0) { showToast('未找到'); return; }
  var text = '顾客：' + (items[0].customer_name || '') + '\n时间：' + (items[0].created_at ? formatDate(items[0].created_at) : '') + '\n------\n';
  var byProduct = {};
  items.forEach(function(item) { var pn = item.product_name || '未知'; if (!byProduct[pn]) byProduct[pn] = []; byProduct[pn].push(item); });
  var total = 0;
  Object.keys(byProduct).forEach(function(pn) {
    var prod = (window.products && window.products.find) ? window.products.find(function(pp) { return pp.name === pn; }) : null;
    var price = prod ? parseFloat(prod.price) : 0;
    var sub = 0;
    text += pn + '\n';
    byProduct[pn].forEach(function(item) {
      var specs = [item.color, item.size, item.spec].filter(Boolean).join('/') || '默认';
      var s = price * item.quantity; sub += s;
      text += '  ' + specs + ' x' + item.quantity + ' = ¥' + s.toFixed(2) + '\n';
    });
    text += '  小计: ¥' + sub.toFixed(2) + '\n'; total += sub;
  });
  text += '------\n合计: ¥' + total.toFixed(2) + '\n';
  // 兼容安卓浏览器的复制方式
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { showToast('已复制'); }).catch(function() { showToast('复制失败'); });
  } else {
    // 安卓旧浏览器fallback
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('已复制'); } catch(e) { showToast('复制失败'); }
    document.body.removeChild(ta);
  }
}

function getProductPrice(name) {
  const p = products.find(pp => pp.name === name);
  return p ? parseFloat(p.price) : 0;
}

async function confirmShip(orderNo) {
  if (!confirm(`确认订单 ${orderNo} 已发货？`)) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/orders?order_number=eq.${orderNo}`, {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: 'completed' })
    });
    showToast('已标记为已发货');
    await loadOrders();
    renderOrders();
  } catch (e) {
    showToast('操作失败');
  }
}

function copyOrders() {
  var searchEl = document.getElementById('order-search');
  var search = (searchEl && searchEl.value || '').toLowerCase();
  var filtered = orders.filter(function(o) {
    var matchStatus = (o.status || 'pending') === orderTab;
    var matchSearch = !search || (o.customer_name || '').toLowerCase().indexOf(search) >= 0;
    return matchStatus && matchSearch;
  });

  // Group by customer, then by product
  const byCustomer = {};
  filtered.forEach(o => {
    const cn = o.customer_name || '未知';
    if (!byCustomer[cn]) byCustomer[cn] = {};
    const pname = o.product_name || '未知商品';
    if (!byCustomer[cn][pname]) byCustomer[cn][pname] = [];
    byCustomer[cn][pname].push(o);
  });

  let text = `Yumi 订单管理 - ${orderTab === 'pending' ? '待发货' : '已完成'}\n`;
  text += `复制时间：${formatDate(new Date().toISOString())}\n\n`;

  // TSV format header (for Excel paste)
  text += '顾客姓名\t商品名称\t订单编号\t颜色\t尺码\t规格\t数量\n';

  for (const [customer, prods] of Object.entries(byCustomer)) {
    for (const [pname, items] of Object.entries(prods)) {
      const p = products.find(pp => pp.name === pname);
      const orderNo = (p && p.order_number) || '未填写';
      items.forEach(item => {
        text += `${customer}\t${pname}\t${orderNo}\t${item.color || '-'}\t${item.size || '-'}\t${item.spec || '-'}\t${item.quantity}\n`;
      });
    }
    text += '\n';
  }

  // Also add readable format
  text += '\n========== 可读格式 ==========\n\n';
  for (const [customer, prods] of Object.entries(byCustomer)) {
    text += `顾客：${customer}\n`;
    for (const [pname, items] of Object.entries(prods)) {
      const p = products.find(pp => pp.name === pname);
      const orderNo = (p && p.order_number) || '未填写';
      text += `  商品：${pname}\n`;
      text += `    订单编号：${orderNo}\n`;
      items.forEach(item => {
        text += `    ${item.color || '-'} ${item.size || '-'} ${item.spec || ''} × ${item.quantity}\n`;
      });
    }
    text += '\n';
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { showToast('已复制到剪贴板'); }).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); document.body.removeChild(ta); showToast('已复制'); } catch(e2) { showToast('复制失败'); }
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); document.body.removeChild(ta); showToast('已复制'); } catch(e) { showToast('复制失败'); }
  }
}

/* ========== History Page ========== */
async function renderHistory() {
  const el = document.getElementById('history-content');
  el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light)">加载中...</div>';

  let myOrders = [];
  try {
    myOrders = await supabaseFetch(`orders?customer_name=eq.${encodeURIComponent(customerName)}&order=created_at.desc&limit=200`);
  } catch (e) {
    myOrders = JSON.parse(localStorage.getItem('yumi_local_orders') || '[]').filter(o => o.customer_name === customerName);
  }

  if (myOrders.length === 0) {
    el.innerHTML = '<h2>历史订单</h2><div style="text-align:center;padding:40px;color:var(--text-light)">您还没有任何订单</div>';
    return;
  }

  // Group by order_number
  const byOrder = {};
  myOrders.forEach(o => {
    if (!byOrder[o.order_number]) byOrder[o.order_number] = [];
    byOrder[o.order_number].push(o);
  });

  let html = `<h2>历史订单</h2><p style="color:var(--text-light);font-size:.9rem;margin-bottom:16px">顾客：${escapeHtml(customerName)}</p>`;
  for (const [orderNo, items] of Object.entries(byOrder)) {
    const status = items[0].status || 'pending';
    // Merge same product+size+color+spec
    const merged = {};
    items.forEach(item => {
      const key = `${item.product_name}|${item.size}|${item.color}|${item.spec || ''}`;
      if (!merged[key]) merged[key] = { ...item, quantity: 0 };
      merged[key].quantity += item.quantity;
    });

    html += `<div class="history-card">
      <div class="hc-header">
        <span class="hc-order-no">${escapeHtml(orderNo)}</span>
        <span class="hc-status ${status}">${status === 'pending' ? '待发货' : '已完成'}</span>
      </div>
      <div class="hc-date">${formatDate(items[0].created_at)}</div>
      ${Object.values(merged).map(item => {
        const p = products.find(pp => pp.name === item.product_name);
        const imgs = p ? parseImages(p) : [];
        const img = imgs[0] || (p && p.image_url) || '';
        return `<div class="hc-item">
          <div class="hci-img">${img ? `<img src="${img}">` : '📦'}</div>
          <div class="hci-info">
            <div class="hci-name">${escapeHtml(item.product_name)}</div>
            <div class="hci-spec">${[item.size, item.color, item.spec].filter(Boolean).join(' / ') || '默认'}</div>
          </div>
          <div class="hci-qty">×${item.quantity}</div>
        </div>`;
      }).join('')}
    </div>`;
  }
  el.innerHTML = html;
}

/* ========== Admin ========== */
function switchAdminTab(tab) {
  adminTab = tab;
  const tabs = ['orders','products','addproduct','password','theme'];
  document.querySelectorAll('#admin-nav button').forEach((btn, i) => {
    btn.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  const sectionId = tab === 'addproduct' ? 'admin-addproduct' : 'admin-' + tab;
  document.getElementById(sectionId).classList.add('active');

  if (tab === 'orders') { forceLoadOrders(); }
  if (tab === 'products') loadAdminProducts();
  if (tab === 'addproduct') initAddProductForm();
  if (tab === 'theme') loadThemeSettings();
  if (tab === 'password') loadEmailJSConfig();
}

function filterProducts(cat) {
  productFilter = cat;
  document.querySelectorAll('#admin-products .sub-tabs button').forEach(b => b.classList.remove('active'));
  const btnId = cat === 'all' ? 'ps-all' : 'ps-' + cat;
  const btn = document.getElementById(btnId);
  if (btn) btn.classList.add('active');
  loadAdminProducts();
}

async function loadAdminProducts() {
  await loadProducts();
  var searchEl2 = document.getElementById('product-search');
  var search = (searchEl2 && searchEl2.value || '').toLowerCase();
  let filtered = products;
  if (productFilter !== 'all') {
    filtered = filtered.filter(p => p.category === productFilter);
  }
  if (search) {
    filtered = filtered.filter(p =>
      (p.name || '').toLowerCase().includes(search) ||
      (p.order_number || '').toLowerCase().includes(search) ||
      getCategoryName(p.category).includes(search)
    );
  }

  if (filtered.length === 0) {
    document.getElementById('product-list-admin').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light)">未找到商品</div>';
    updateBatchBar();
    return;
  }

  document.getElementById('product-list-admin').innerHTML = filtered.map(p => {
    const imgs = parseImages(p);
    const img = imgs[0] || p.image_url || '';
    const checked = selectedProductIds.includes(p.id) ? 'checked' : '';
    const stocks = parseColorStock(p);
    const stockSummary = Object.keys(stocks).length > 0
      ? Object.entries(stocks).map(([k,v]) => `${k.split('|')[0]}:${v}`).join(' ')
      : '未设库存';
    return `
    <div class="product-item-admin">
      <input type="checkbox" ${checked} onchange="toggleSelectProduct('${p.id}',this.checked)" style="flex-shrink:0;width:20px;height:20px">
      <div class="pa-img">${img ? `<img src="${img}">` : '<span>📦</span>'}</div>
      <div class="pa-info">
        <div class="pa-name">${escapeHtml(p.name)} ${p.order_number ? `<span style="color:var(--text-light);font-size:.75rem">(${escapeHtml(p.order_number)})</span>` : ''}</div>
        <div class="pa-meta">${getCategoryName(p.category)} · ¥${p.price} · 库存: ${stockSummary}</div>
      </div>
      <div class="pa-actions">
        <button class="btn btn-sm btn-outline" onclick="editProduct('${p.id}')">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
  updateBatchBar();
}

function toggleSelectProduct(id, checked) {
  if (checked && !selectedProductIds.includes(id)) selectedProductIds.push(id);
  if (!checked) selectedProductIds = selectedProductIds.filter(pid => pid !== id);
  updateBatchBar();
}

function toggleSelectAll(checkbox) {
  if (checkbox.checked) {
    var searchEl2 = document.getElementById('product-search');
  var search = (searchEl2 && searchEl2.value || '').toLowerCase();
    let filtered = products;
    if (productFilter !== 'all') filtered = filtered.filter(p => p.category === productFilter);
    if (search) {
      filtered = filtered.filter(p =>
        (p.name || '').toLowerCase().includes(search) ||
        (p.order_number || '').toLowerCase().includes(search) ||
        getCategoryName(p.category).includes(search)
      );
    }
    selectedProductIds = filtered.map(p => p.id);
  } else {
    selectedProductIds = [];
  }
  loadAdminProducts();
}

function updateBatchBar() {
  const bar = document.getElementById('batch-bar');
  if (!bar) return;
  bar.style.display = selectedProductIds.length > 0 ? 'flex' : 'none';
}

function clearProductSelection() {
  selectedProductIds = [];
  const cb = document.getElementById('select-all-products');
  if (cb) cb.checked = false;
  loadAdminProducts();
}

async function batchDeleteProducts() {
  if (selectedProductIds.length === 0) return;
  if (!confirm(`确定删除选中的 ${selectedProductIds.length} 个商品？此操作不可撤销！`)) return;
  for (const id of selectedProductIds) {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=minimal' }
      });
    } catch (e) { console.error('Delete failed:', e); }
  }
  showToast(`已删除 ${selectedProductIds.length} 个商品`);
  selectedProductIds = [];
  await loadAdminProducts();
}

function editProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  editingProductId = id;
  switchAdminTab('addproduct');
  // Fill form
  document.getElementById('ap-edit-id').value = id;
  document.getElementById('ap-name').value = p.name;
  document.getElementById('ap-category').value = p.category;
  document.getElementById('ap-price').value = p.price;
  document.getElementById('ap-order-no').value = p.order_number || '';
  document.getElementById('ap-desc').value = p.description || '';

  // Sizes
  const customSizes = p.sizes ? p.sizes.split(',').map(s => s.trim()).filter(Boolean) : [];
  const fixedSizes = ['S','M','L','XL','2XL','3XL','4XL'];
  document.querySelectorAll('#ap-sizes-fixed .option-btn').forEach(btn => {
    btn.classList.toggle('active', customSizes.includes(btn.dataset.size));
  });
  apCustomSizes = customSizes.filter(s => !fixedSizes.includes(s));
  renderCustomSizes();

  // Colors
  const customColors = p.colors ? p.colors.split(',').map(s => s.trim()).filter(Boolean) : [];
  const fixedColors = ['黑色','白色','红色','肤色'];
  apSelectedColors = [...customColors];
  document.querySelectorAll('#ap-colors-fixed .option-btn').forEach(btn => {
    btn.classList.toggle('active', apSelectedColors.includes(btn.dataset.color));
  });
  apCustomColors = customColors.filter(c => !fixedColors.includes(c));
  renderCustomColors();

  // Color images and stocks
  apColorImages = parseColorImages(p);
  apColorStocks = parseColorStock(p);
  apComboStocks = parseColorStock(p);
  renderColorConfig();

  // Custom specs
  apCustomSpecs = parseCustomSpecs(p);
  renderCustomSpecs();

  // Main images
  apMainImages = [null,null,null,null,null];
  const imgs = parseImages(p);
  for (let i = 0; i < Math.min(5, imgs.length); i++) apMainImages[i] = imgs[i];
  renderMainImages();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ========== Add Product Form ========== */
function initAddProductForm() {
  if (!document.getElementById('ap-name').value) resetAddProductForm();
  renderMainImages();
  renderColorConfig();
  renderCustomSpecs();
}

function resetAddProductForm() {
  editingProductId = null;
  document.getElementById('ap-edit-id').value = '';
  document.getElementById('ap-name').value = '';
  document.getElementById('ap-category').value = 'cosmetics';
  document.getElementById('ap-price').value = '';
  document.getElementById('ap-order-no').value = '';
  document.getElementById('ap-desc').value = '';
  document.querySelectorAll('#ap-sizes-fixed .option-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('#ap-colors-fixed .option-btn').forEach(b => b.classList.remove('active'));
  apCustomSizes = []; apCustomColors = []; apSelectedColors = [];
  apCustomSpecs = [];
  apColorImages = {}; apColorStocks = {}; apComboStocks = {};

  if (colors.length === 0) {
    el.innerHTML = '<p style="color:var(--text-light);font-size:.8rem">请先选择颜色</p>';

  }

  if (sizes.length === 0) {

    el.innerHTML = colors.map(c => {
      const img = apColorImages[c] || '';

      return `<div class="color-stock-row">
        <label class="csr-img" onchange="uploadColorImg('${c.replace(/'/g,"\\'")}',this)">
          ${img ? `<img src="${img}">` : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>'}

        </label>
        <span class="csr-color">${escapeHtml(c)}</span>

      </div>`;
    }).join('');
    return;
  }

  // Combo matrix: rows=colors, cols=sizes
  let html = '<div class="combo-batch-bar">';
  html += '<label style="display:flex;align-items:center;gap:4px;font-size:.8rem"><input type="checkbox" id="combo-select-all" onchange="toggleAllCombos(this)"> 全选</label>';
  html += '<button onclick="batchAdjustStock(1)">批量+1</button>';
  html += '<button onclick="batchAdjustStock(-1)">批量-1</button>';
  html += '<button onclick="batchSetStock()">批量设置</button>';
  html += '</div>';

  html += '<div style="overflow-x:auto"><table class="combo-stock-table"><thead><tr>';
  html += '<th>颜色</th>';
  sizes.forEach(s => { html += `<th>${escapeHtml(s)}</th>`; });
  html += '<th>合计</th>';
  html += '</tr></thead><tbody>';

  colors.forEach(c => {
    const img = apColorImages[c] || '';
    html += '<tr>';
    html += `<td class="combo-color-cell">${img ? `<img src="${img}" title="${escapeHtml(c)}">` : `<span class="no-img">无图</span>`}${escapeHtml(c)}</td>`;
    let rowTotal = 0;
    sizes.forEach(s => {
      const key = c + '|' + s;
      const stock = apComboStocks[key] !== undefined ? apComboStocks[key] : 0;
      rowTotal += stock;
      html += `<td>
        <div style="display:flex;align-items:center;justify-content:center;gap:2px">
          <button class="combo-stock-btn" onclick="adjustComboStock('${c.replace(/'/g,"\\'")}','${s}',-1)">−</button>
          <input type="number" class="combo-stock-input" value="${stock}" min="0" onchange="setComboStock('${c.replace(/'/g,"\\'")}','${s}',this.value)" data-color="${escapeHtml(c)}" data-size="${escapeHtml(s)}">
          <button class="combo-stock-btn" onclick="adjustComboStock('${c.replace(/'/g,"\\'")}','${s}',1)">+</button>
        </div>
      </td>`;
    });
    html += `<td style="font-weight:700;color:var(--pink)">${rowTotal}</td>`;
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  el.innerHTML = html;
}

function setComboStock(color, size, val) {
  const key = color + '|' + size;
  apComboStocks[key] = parseInt(val) || 0;
}
function adjustComboStock(color, size, delta) {
  const key = color + '|' + size;
  const cur = apComboStocks[key] || 0;
  apComboStocks[key] = Math.max(0, cur + delta);
  renderColorConfig();
}
function toggleAllCombos(checkbox) {
  document.querySelectorAll('.combo-stock-input').forEach(inp => {
    inp.checked = checkbox.checked;
  });
}
function getSelectedCombos() {
  return Array.from(document.querySelectorAll('.combo-stock-input'));
}
function batchAdjustStock(delta) {
  const inputs = getSelectedCombos();
  let changed = false;
  inputs.forEach(inp => {
    if (inp.checked) {
      const color = inp.dataset.color;
      const size = inp.dataset.size;
      const key = color + '|' + size;
      const cur = apComboStocks[key] || 0;
      apComboStocks[key] = Math.max(0, cur + delta);
      changed = true;
    }
  });
  if (!changed) { showToast('请先勾选要调整的组合'); return; }
  renderColorConfig();
}
function batchSetStock() {
  const val = prompt('输入库存数量:');
  if (val === null) return;
  const num = parseInt(val);
  if (isNaN(num) || num < 0) { showToast('请输入有效数字'); return; }
  const inputs = getSelectedCombos();
  let changed = false;
  inputs.forEach(inp => {
    if (inp.checked) {
      const key = inp.dataset.color + '|' + inp.dataset.size;
      apComboStocks[key] = num;
      changed = true;
    }
  });
  if (!changed) { showToast('请先勾选要调整的组合'); return; }
  renderColorConfig();
}

async function saveAddProduct() {
  const name = document.getElementById('ap-name').value.trim();
  const category = document.getElementById('ap-category').value;
  const price = parseFloat(document.getElementById('ap-price').value);
  const orderNo = document.getElementById('ap-order-no').value.trim();
  const description = document.getElementById('ap-desc').value.trim();
  const id = document.getElementById('ap-edit-id').value;

  if (!name || isNaN(price)) { showToast('请填写商品名称和价格'); return; }

  // Collect sizes
  const fixedSizes = ['S','M','L','XL','2XL','3XL','4XL'];
  const selectedFixed = [];
  document.querySelectorAll('#ap-sizes-fixed .option-btn.active').forEach(b => selectedFixed.push(b.dataset.size));
  const allSizes = [...selectedFixed, ...apCustomSizes];

  // Colors already in apSelectedColors
  const allColors = [...apSelectedColors];

  // Main images (filter nulls)
  const images = apMainImages.filter(Boolean);

  // 合并自定义规格库存到 apComboStocks（三段式 key：颜色|尺码|规格值）
  // 仅当没有颜色和尺码时，自定义规格选项独立存库存；否则与颜色/尺码组合
  const mergedStocks = { ...apComboStocks };
  if (apCustomSpecs.length > 0) {
    apCustomSpecs.forEach(sp => {
      sp.options.forEach(opt => {
        if (opt.stock !== '' && opt.stock !== undefined && opt.stock !== null) {
          // 规格选项的库存 key：颜色|尺码|规格值（当前简化：独立规格库存）
          const specKey = buildStockKey('', '', opt.value);
          mergedStocks[specKey] = parseInt(opt.stock) || 0;
        }
      });
    });
  }

  // 序列化自定义规格（只存 name + options.value + stock）
  const specsToSave = apCustomSpecs.map(sp => ({
    name: sp.name,
    options: sp.options.map(o => ({ value: o.value, stock: o.stock }))
  }));

  const productData = {
    name, category, price,
    sizes: allSizes.join(','),
    colors: allColors.join(','),
    description,
    order_number: orderNo,
    images: JSON.stringify(images),
    color_images: JSON.stringify(apColorImages),
    color_stock: JSON.stringify(mergedStocks),
    custom_specs: JSON.stringify(specsToSave),
    image_url: images[0] || ''
  };

  try {
    if (id) {
      await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
        method: 'PATCH',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify(productData)
      });
    } else {
      await fetch(`${SUPABASE_URL}/rest/v1/products`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ ...productData, created_at: new Date().toISOString() })
      });
    }
    resetAddProductForm();
    await loadProducts();
    showToast('保存成功');
    switchAdminTab('products');
  } catch (e) {
    console.error('Save product failed:', e);
    showToast('保存失败，请检查网络连接');
  }
}

let homeCarouselImgs = [];
let homeCarouselIdx = 0;
let homeCarouselTimer = null;

async function loadHomeCarousel() {
  try {
    const data = await getSiteConfig('home_carousel');
    homeCarouselImgs = data ? JSON.parse(data) : [];
  } catch { homeCarouselImgs = []; }
  renderHomeCarousel();
}

function renderHomeCarousel() {
  const track = document.getElementById('home-carousel-track');
  const dots = document.getElementById('home-carousel-dots');
  if (!track) return;
  if (homeCarouselImgs.length === 0) {
    track.innerHTML = '<div class="carousel-slide" style="background:linear-gradient(135deg,var(--pink-light),var(--purple-light));display:flex;align-items:center;justify-content:center"><span style="font-size:1.5rem;font-weight:700;color:var(--pink);font-family:Georgia,serif">Yumi</span></div>';
    if (dots) dots.innerHTML = '';
    return;
  }
  track.innerHTML = homeCarouselImgs.map(url => `<div class="carousel-slide"><img src="${url}" alt=""></div>`).join('');
  if (dots) dots.innerHTML = homeCarouselImgs.map((_,i) => `<div class="dot ${i===0?'active':''}" onclick="homeCarouselGoto(${i})"></div>`).join('');
  homeCarouselIdx = 0;
  startHomeCarouselAuto();
}

function startHomeCarouselAuto() {
  if (homeCarouselTimer) clearInterval(homeCarouselTimer);
  if (homeCarouselImgs.length <= 1) return;
  homeCarouselTimer = setInterval(() => {
    homeCarouselIdx = (homeCarouselIdx + 1) % homeCarouselImgs.length;
    updateHomeCarouselPos();
  }, 3000);
}

function updateHomeCarouselPos() {
  const track = document.getElementById('home-carousel-track');
  if (track) track.style.transform = `translateX(-${homeCarouselIdx * 100}%)`;
  document.querySelectorAll('#home-carousel-dots .dot').forEach((d,i) => d.classList.toggle('active', i === homeCarouselIdx));
}

function homeCarouselGoto(i) {
  homeCarouselIdx = i;
  updateHomeCarouselPos();
  startHomeCarouselAuto();
}

  renderCarouselPreview();
  showToast('已删除');
}

async function clearCarousel() {
  if (!confirm('确定清空所有轮播图？')) return;
  homeCarouselImgs = [];
  await setSiteConfig('home_carousel', JSON.stringify([]));
  renderCarouselPreview();
  showToast('已清空');
}

async function uploadBg(key, fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  try {
    const filename = `backgrounds/${key}_${Date.now()}.jpg`;
    const url = await uploadToStorage(file, 'site-images', filename);
    await setSiteConfig(key, url);
    applyBackground(key, url);
    await loadThemeSettings();
    showToast('背景图已更新');
  } catch (e) {
    console.error('Upload bg failed:', e);
    showToast('上传失败');
  }
}

/* ========== Utils ========== */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function dataURItoBlob(dataURI) {
  const parts = dataURI.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const binary = atob(parts[1]);
  const array = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) array[i] = binary.charCodeAt(i);
  return new Blob([array], { type: mime });
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timeout);
  el._timeout = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ========== Initialization ========== */
document.addEventListener('DOMContentLoaded', initApp);
</script>
